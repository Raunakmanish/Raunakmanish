<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B18"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#00F5FF"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
<style>
.h{font:800 36px Arial;fill:#fff}
.box{fill:#111827;stroke:#26334D}
.name{font:700 16px Arial;fill:#fff}
.icon{font:800 22px Arial;fill:#00F5FF}
.cat{font:700 19px Arial;fill:#a78bfa}
.bar{animation:glow 3s infinite}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</defs>

<rect width="1200" height="560" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="558" rx="26" stroke="#26334D"/>
<text x="48" y="66" class="h">Tech Stack</text>
<rect class="bar" x="48" y="90" width="1080" height="3" fill="url(#g)"/>

<text x="48" y="135" class="cat">Backend & APIs</text>
<g transform="translate(48 155)">
<g><rect class="box" width="110" height="78" rx="14"/><text x="32" y="36" class="icon">PHP</text><text x="38" y="61" class="name">PHP</text></g>
<g transform="translate(125 0)"><rect class="box" width="110" height="78" rx="14"/><text x="45" y="36" class="icon">L</text><text x="25" y="61" class="name">Laravel</text></g>
<g transform="translate(250 0)"><rect class="box" width="110" height="78" rx="14"/><text x="34" y="36" class="icon">JS</text><text x="28" y="61" class="name">Node.js</text></g>
