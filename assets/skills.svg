<g transform="translate(625 0)"><rect class="box" width="110" height="78" rx="14"/><text x="30" y="36" class="icon">API</text><text x="26" y="61" class="name">REST API</text></g>
<g transform="translate(750 0)"><rect class="box" width="110" height="78" rx="14"/><text x="30" y="36" class="icon">JWT</text><text x="37" y="61" class="name">JWT</text></g>
<g transform="translate(875 0)"><rect class="box" width="110" height="78" rx="14"/><text x="22" y="36" class="icon">RBAC</text><text x="33" y="61" class="name">RBAC</text></g>
</g>

