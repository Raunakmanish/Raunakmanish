<g transform="translate(625 0)"><rect class="box" width="110" height="78" rx="14"/><text x="30" y="36" class="icon">AWS</text><text x="35" y="61" class="name">AWS</text></g>
<g transform="translate(750 0)"><rect class="box" width="110" height="78" rx="14"/><text x="34" y="36" class="icon">Git</text><text x="36" y="61" class="name">Git</text></g>
<g transform="translate(875 0)"><rect class="box" width="110" height="78" rx="14"/><text x="22" y="36" class="icon">Linux</text><text x="30" y="61" class="name">Linux</text></g>
